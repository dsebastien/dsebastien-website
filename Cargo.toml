# The Rust code of this repository. One member for now: the command line
# program of the publishing tool (ADR 0009).
[workspace]
resolver = "3"
members = ["cli"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/dsebastien/dsebastien-website"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
