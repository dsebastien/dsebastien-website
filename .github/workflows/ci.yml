name: CI

# Each push to any branch starts the checks. A step that fails fails the run.
on:
    push:
    workflow_dispatch:

permissions:
    contents: read

env:
    ASTRO_TELEMETRY_DISABLED: 1

jobs:
    checks:
        runs-on: ubuntu-slim

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            # ESLint, Astro and commitlint have a `node` shebang.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            # The parity test builds the Rust program and compares its output
            # with the TypeScript implementation (ADR 0009). The version is the
            # one of `rust-toolchain.toml`: a guard test checks it.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.100.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Gate at `high`: advisories come from other projects, and a gate at
            # every level breaks unrelated work for each new low advisory.
            # GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7, slow regular expression): no
            # corrected version exists. The package arrives through Astro, Vite and
            # typescript-eslint, and it reads only glob patterns of this repository
            # at build time, never input from a visitor. Remove the ignore when
            # picomatch ships a correction.
            - name: Audit dependencies
              run: bun audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

            - name: Type check
              run: bun run tsc

            - name: Astro check
              run: bun run check

            - name: Lint
              run: bun run lint

            # The commit hook test needs Git 2.54 or later (config-based hooks).
            - name: Git version
              run: git --version

            - name: Test
              run: bun run test

            - name: Format check
              run: bun run format:check

            - name: Build
              run: bun run build

    # The time budgets of the note page (issue 47, PERF-22, R57): Lighthouse,
    # median of five runs on mobile and on desktop, behind a Brotli proxy. A
    # time above its budget gets five more runs; a layout shift blocks at
    # once. The byte budgets are a test of the job `checks`. The full Ubuntu
    # image has Chrome.
    budgets:
        runs-on: ubuntu-latest
        # Each run waits for a quiet machine: a busy runner must not run for hours.
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            # Astro and Lighthouse have a `node` shebang.
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Note page budgets
              run: bun run budgets

            # The reports of Lighthouse, to read why a time failed.
            - name: Reports of Lighthouse
              # Also after the time limit, which cancels the job.
              if: ${{ !success() }}
              uses: actions/upload-artifact@v7
              with:
                  name: lighthouse-reports
                  path: .cache/page-budgets
                  include-hidden-files: true

    # The command line program of the publishing tool runs on Linux and on
    # Windows (ADR 0009), so its checks run on both.
    rust:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            # The version of `rust-toolchain.toml`.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.100.0
                  components: rustfmt, clippy

            - name: Format check
              run: bun run rust:format:check

            - name: Lint
              run: bun run rust:lint

            - name: Test
              run: bun run rust:test
