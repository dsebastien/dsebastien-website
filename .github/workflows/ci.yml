name: CI

# Each push to any branch starts the checks. A step that fails fails the run.
on:
    push:
    workflow_dispatch:

permissions:
    contents: read

env:
    ASTRO_TELEMETRY_DISABLED: 1

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            # ESLint, Astro and commitlint have a `node` shebang.
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            # The parity test builds the Rust program and compares its output
            # with the TypeScript implementation (ADR 0009). The version is the
            # one of `rust-toolchain.toml`: a guard test checks it.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
              with:
                  toolchain: 1.100.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Gate at `high`: advisories come from other projects, and a gate at
            # every level breaks unrelated work for each new low advisory.
            - name: Audit dependencies
              run: bun audit --audit-level=high

            - name: Type check
              run: bun run tsc

            - name: Astro check
              run: bun run check

            - name: Lint
              run: bun run lint

            # The commit hook test needs Git 2.54 or later (config-based hooks).
            - name: Git version
              run: git --version

            # The browser tests (issue 57) drive the Chrome of the image with
            # playwright-core: no browser is downloaded. Without Chrome they fail.
            - name: Chrome version
              run: google-chrome --version

            - name: Test
              run: bun run test

            - name: Format check
              run: bun run format:check

            - name: Build
              run: bun run build

    # The time budgets of the note page (issue 47, PERF-22, R57): Lighthouse,
    # median of five runs on mobile and on desktop, behind a Brotli proxy. A
    # time above its budget gets five more runs; a layout shift blocks at
    # once. The byte budgets are a test of the job `checks`. The full Ubuntu
    # image has Chrome.
    budgets:
        runs-on: ubuntu-latest
        # Each run waits for a quiet machine: a busy runner must not run for hours.
        # The setup of the budgets of the publishing tool publishes the corpus once.
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            # Astro and Lighthouse have a `node` shebang.
            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc

            # The budgets of the publishing tool build the release of the Rust
            # program. The version of `rust-toolchain.toml`. They run on main and
            # on manual runs only: their setup publishes the corpus once.
            - name: Setup Rust
              if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
              uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
              with:
                  toolchain: 1.100.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Note page budgets
              run: bun run budgets

            # The budget of the first search (R57), on the invented corpus of full
            # size. It runs also when a time budget of the note page failed.
            - name: Invented corpus
              if: ${{ !cancelled() }}
              run: bun run corpus

            - name: First search budget
              if: ${{ !cancelled() }}
              run: bun run budgets:search

            # The budgets of the publishing tool (issue 59, R97, PERF-15): status
            # and plan, in Rust (release) and in TypeScript (Bun), on the same
            # corpus, against ceilings scaled for the corpus and the runner.
            - name: Publishing tool budgets
              if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
              run: bun run budgets:tool

            # The reports of Lighthouse, to read why a time failed.
            - name: Reports of Lighthouse
              # Also after the time limit, which cancels the job.
              if: ${{ !success() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: lighthouse-reports
                  path: .cache/page-budgets
                  include-hidden-files: true

    # The command line program of the publishing tool runs on Linux and on
    # Windows (ADR 0009), so its checks run on both.
    rust:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            # The version of `rust-toolchain.toml`.
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
              with:
                  toolchain: 1.100.0
                  components: rustfmt, clippy

            # Advisories of the Rust crates held by `Cargo.lock`. The tool is
            # pinned, and its prebuilt binary saves a build on each run. It reads
            # the live advisory database, so a new advisory can fail an unrelated run.
            - name: Install cargo-audit
              if: matrix.os == 'ubuntu-latest'
              uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
              with:
                  tool: cargo-audit@0.23.0

            - name: Audit Rust dependencies
              if: matrix.os == 'ubuntu-latest'
              run: cargo audit

            - name: Format check
              run: bun run rust:format:check

            - name: Lint
              run: bun run rust:lint

            - name: Test
              run: bun run rust:test
